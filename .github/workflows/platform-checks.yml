# Pre-merge checks for the OMI platform.
#
# Until now nothing ran on a PR, so the auto-merge bot's "every check is green"
# test was vacuously true and a change could only be found broken in production.
# A hook added below an early return in PressCampaignDetail shipped that way and
# took the Earned page down with "Rendered more hooks than during the previous
# render" — a crash `vite build` is perfectly happy to produce.
#
# Deliberately fast and narrow: the checks that catch a crash, not a style gate.
#   - rules-of-hooks, which is the one lint rule whose violation always crashes
#   - the frontend build
#   - the backend suites that need no database, out-of-office extraction
#     among them: it decides which contacts reach the press list, and its
#     failure mode is a plausible wrong name rather than a crash
#
# The database-backed suites (press-segments, press-audience-routes,
# contact-country, design-routes.db) are not here yet: migration 001 creates schema_migrations,
# which migrations/run.js has already created, so a bootstrap from empty fails
# and CI has no schema to run against. Worth fixing; until then those suites run
# locally against a scratch database.

name: Platform checks

on:
  pull_request:
    paths:
      - 'dev/platform/**'
      - '.github/workflows/platform-checks.yml'
      # The briefs guard reads docs/omi/ and the root CLAUDE.md, so a change
      # that only touches those is exactly the change that breaks it: deleting
      # the pointer out of agent-guide.md, or adding a brief and not indexing
      # it, is a docs-only commit. Without these paths the guard never runs on
      # the one kind of PR it exists to catch.
      - 'docs/omi/**'
      - 'CLAUDE.md'
      # The same guard pins .claude/agents/ux-critic.md, the standing design
      # authority. Editing or deleting an agent definition touches neither
      # dev/platform/ nor docs/, so without this path the guard would not run
      # on the one commit that could quietly remove it.
      - '.claude/agents/**'

concurrency:
  group: platform-checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: dev/platform/frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci --no-audit --no-fund
      - name: Rules of Hooks
        run: npm run lint:hooks
      - name: Build
        run: npm run build
      # Neither of the two steps above renders anything. The Design tab shipped
      # broken twice in one afternoon on crashes both of them compiled happily:
      # a dependency array naming a const declared below it, and the autosave
      # that disposed the canvas and reloaded a stale scene. This step mounts
      # the page in Chromium, adds layers, saves, and checks the work is still
      # on the canvas. See tests/browser/smoke.mjs.
      - name: Guard — resizing a set does not wreck its pages
        run: npm run test:units
      - name: Chromium for the browser test
        run: npx playwright install --with-deps chromium
      - name: Guard — the Design page renders and keeps your work
        run: npm run test:browser

  # The browser drives, against the fixture server, on every PR.
  #
  # They were written, committed, and then only ever run when an agent
  # remembered. Database > Publications shipped broken and stayed broken for a
  # day because the one thing that opens that screen is a drive, and no run
  # happened in between. Roughly 200 assertions across 27 drives covering
  # placement, empty states, what a click sends and whether a screen renders
  # at all — none of which a source guard can see.
  #
  # Probes (probe-*.mjs) are deliberately excluded. They print observations
  # for a person to read and assert nothing, so running them here would dress
  # a diagnostic tool up as a guard.
  #
  # The glob is the list. A drive added to the directory runs from the moment
  # it lands, so there is no second list here to drift out of date.
  drives:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install frontend deps
        working-directory: dev/platform/frontend
        run: npm ci --no-audit --no-fund
      # The stub imports real backend services on purpose — adsCurrency and
      # aiModels — so a drive checks the shipped rule rather than a convenient
      # copy of it. aiModels reaches src/db.js and therefore pg, so without
      # these the stub cannot start and every drive fails on a connection
      # refusal. That is how this job failed the first time it ran.
      - name: Install backend deps, which the stub imports
        working-directory: dev/platform/backend
        run: npm ci --no-audit --no-fund
      - name: Build the app the drives run against
        working-directory: dev/platform/frontend
        run: npm run build
      - name: Chromium
        working-directory: dev/platform/frontend
        run: npx playwright install --with-deps chromium
      # No NODE_PATH here on purpose. It does nothing for ESM, and the drives
      # are ESM: pw.mjs resolves Playwright by path instead, naming the
      # frontend's own install. Setting it looked like it worked locally only
      # because the container has a copy under /opt that pw.mjs tries first.
      - name: Run every drive
        working-directory: dev/platform/drives
        run: |
          node stub-server.js &
          stub=$!
          for i in $(seq 1 30); do
            curl -sf -o /dev/null http://127.0.0.1:4599/ && break
            sleep 1
          done
          curl -sf -o /dev/null http://127.0.0.1:4599/ || { echo "stub never came up"; exit 1; }
          failed=""
          for f in drive-*.mjs; do
            echo "::group::$f"
            if node "$f"; then
              echo "::endgroup::"
            else
              echo "::endgroup::"
              echo "::error file=dev/platform/drives/$f::$f failed"
              failed="$failed $f"
            fi
            # A drive that kills the stub would make every later one look
            # broken. That cost a whole run once, so it is checked rather
            # than assumed.
            curl -sf -o /dev/null http://127.0.0.1:4599/ || { echo "::error::the stub died during $f"; exit 1; }
          done
          kill $stub 2>/dev/null || true
          if [ -n "$failed" ]; then echo "FAILED:$failed"; exit 1; fi

  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: dev/platform/backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci --no-audit --no-fund
      - name: Guard — every unattended AI loop checks its budget
        run: node tests/budget-gating.test.js
      - name: Guard — the paste importer cannot silently import nothing
        run: node tests/press-import.test.js
      - name: Guard — out-of-office extraction reads the right name
        run: node src/services/oooExtract.test.js
      - name: Guard — the reply catch-up reads opt-outs correctly
        run: node src/services/replyCatchup.test.js
      - name: Guard — a reply is read as the journalist wrote it
        run: node src/services/mimeText.test.js
      - name: Guard — a proposal cannot overclaim or invent a price
        run: node src/services/proposalMethods.test.js
      - name: Guard — a refused calendar call says why
        run: node src/services/googleCalendar.test.js
      - name: Guard — the social report counts the posts OMI did not publish
        run: node tests/social-report.test.js
      - name: Guard — the autopilot is off unless somebody turned it on
        run: node tests/autopilot-off.test.js
      - name: Guard — every settings field is one the server will store
        run: node tests/settings-keys.test.js
      - name: Guard — a hand-added journalist is a journalist, added once
        run: node tests/contact-create.test.js
      - name: Guard — a winner beat its own account, not a flattering fraction
        run: node src/services/socialBaseline.test.js
      - name: Guard — a long screen recording can actually be saved
        run: node tests/recording-upload.test.js
      - name: Guard — a deploy reaches the browser, and names its build
        run: node tests/deploy-visibility.test.js
      - name: Guard — the design studio keeps the work
        run: node tests/design-studio.test.js
      - name: Guard — an IMAP socket error cannot take the backend down
        run: node tests/imap-client.test.js
      - name: Guard — PHP support dates are right, so a client site is not called safe
        run: node tests/php-support.test.js
      - name: Guard — the detector reads what is on screen, and says where it is
        run: node tests/pangram.test.js
      - name: Guard — the PR leaderboard is scoped to a real client, not an admin's null
        run: node tests/pr-leaderboard-scope.test.js
      - name: Guard — revenue never wears a currency no store reported
        run: node tests/ecom-currency.test.js
      - name: Guard — a carried briefing item keeps its age, never another's
        run: node tests/strategist-queue.test.js
      - name: Guard — a briefing never ships an empty queue in silence
        run: node tests/strategist-fallback.test.js
      - name: Guard — a worked example is made once, and a failure is never called success
        run: node tests/worked-examples.test.js
      - name: Guard — Moz is asked about the right domain, and the sweep clears the rate limit
        run: node tests/seo-authority.test.js
      - name: Guard — "needs attention" only counts what is actually slipping
        run: node tests/strategist-attention.test.js
      - name: Guard — the Monday email sends the briefing the platform shows
        run: node tests/strategist-weekly.test.js
      - name: Guard — a pillar's share is a share of the whole account
        run: node tests/channel-pillars.test.js
      - name: Guard — ad spend summed across currencies carries no symbol
        run: node tests/ads-currency.test.js
      - name: Guard — the postcode walk returns its store's currency
        run: node tests/postcode-currency.test.js
      - name: Guard — a report with no recipients is never generated
        run: node tests/report-recipients.test.js
      - name: Guard — a sent report can never be bulk deleted
        run: node tests/bulk-delete-reports.test.js
      - name: Guard — a shared recording is seekable, and a rewind is not a re-download
        run: node tests/watch-stream.test.js
      - name: Guard — the writer of a release can pitch it without waiting on a client
        run: node tests/press-campaign-gate.test.js
      - name: Guard — search never reaches past the clients you can see
        run: node tests/global-search.test.js
      - name: Guard — the R2 migration never frees a copy it has not verified
        run: node tests/media-to-r2.test.js
      - name: Guard — the R2 preflight catches a bucket that only looks healthy
        run: node tests/r2-preflight.test.js
      - name: Guard — one ffmpeg for the whole backend
        run: node tests/ffmpeg-bin.test.js
      # The box installs with --omit=dev, so this asks about that tree only.
      # It replaced 59 findings (1 critical) on 31 Oct 2026; see
      # docs/omi/dependency-audit.md for what was fixed and what is accepted.
      - name: Guard — no known-vulnerable production dependencies
        run: node scripts/audit-check.js --all
      # `archiver` went in at ^8.0.0 with the extension-download route. That
      # major is ESM-only and exports named classes with no callable default,
      # so the route's `archiver('zip', …)` threw "archiver is not a function"
      # on every request and nothing caught it: the only require is inside the
      # handler, so it is not reached until somebody clicks the button. This
      # zips a real directory both ways the route and the override touch.
      - name: Guard — archiver is callable, and its overridden glob still works
        run: node tests/archiver-contract.test.js
      - name: Guard — a PDF leaves the service as a Buffer, not JSON
        run: node tests/pdf-buffer.test.js
      - name: Guard — a library clip the editor can open is not refused
        run: node tests/clip-source.test.js
      - name: Guard — a downloaded batch never comes up short in silence
        run: node tests/social-export.test.js
      # The caption and scene guards render real frames, and both SKIP when
      # ffmpeg is absent. A guard that skips is a guard that is not running, so
      # the runner is given ffmpeg rather than trusted to have it, and each
      # step checks for it rather than assuming the install above worked.
      - name: Install ffmpeg for the render guards
        run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
      - name: Guard — the playback remux actually unfragments the file
        run: |
          node -e "require('child_process').execFileSync('ffmpeg',['-version'],{stdio:'ignore'})" \
            || { echo 'ffmpeg missing: the remux structure assertions would not run'; exit 1; }
          node tests/recording-remux.test.js
      # Every other render guard asserts on the filter_complex STRING, which is
      # how two faults that broke the most ordinary edits reached production:
      # the graph read correctly and the video did not. This one renders real
      # footage through the real module and samples the frames.
      - name: Guard — the render graph produces the right pixels, not just the right string
        run: |
          node -e "require('child_process').execFileSync('ffmpeg',['-version'],{stdio:'ignore'})" \
            || { echo 'ffmpeg missing: the pixel assertions would not run'; exit 1; }
          node tests/composition-render-pixels.test.js
      # The same argument one level up: a template that validates and binds is
      # not a template that renders. Three faults made "upload photographs and
      # brief it" impossible and every one of them left the graph string
      # correct — a caption source became an ffmpeg input with no disk path, a
      # still was asked for an audio stream it does not have, and a one-frame
      # input was never looped. This binds the shipped templates and samples
      # the frames, including the burned type.
      - name: Guard — the shipped templates render real pictures and real type
        run: |
          node -e "require('child_process').execFileSync('ffmpeg',['-version'],{stdio:'ignore'})" \
            || { echo 'ffmpeg missing: the template pixel assertions would not run'; exit 1; }
          node tests/template-render-pixels.test.js
      # The way ffmpeg loses an overlay is silently. `drawbox` writes colour
      # and leaves alpha at zero, so a rule drawn with it composites as
      # nothing with no error; `format=yuva420p` after geq rather than before
      # gives no alpha plane to write and the effect comes out opaque.
      # Neither shows in a graph string and neither fails a render, so the
      # three effects are sampled on real frames.
      - name: Guard — the three effects are visible, and only where they should be
        run: |
          node -e "require('child_process').execFileSync('ffmpeg',['-version'],{stdio:'ignore'})" \
            || { echo 'ffmpeg missing: the effect pixel assertions would not run'; exit 1; }
          node tests/composition-fx-pixels.test.js
      # The graph guard proves the renderer writes `-loop 1` and bounds it
      # with `-t`. It cannot prove the result is a moving picture, and both
      # ways a still fails are silent: one frame encodes without error as a
      # frozen flash, and an animated scale that resolves to a constant looks
      # exactly like a correct render of "hold". So every move is rendered and
      # the frames are read back, with a held photograph as the control, which
      # measures 0.000 and is what makes a number above zero mean motion.
      - name: Guard — a camera move over a photograph actually moves
        run: |
          node -e "require('child_process').execFileSync('ffmpeg',['-version'],{stdio:'ignore'})" \
            || { echo 'ffmpeg missing: the still pixel assertions would not run'; exit 1; }
          node tests/composition-still-pixels.test.js
      # The frames that go to the model, and what is done with the answer. It
      # samples a real file: the first version of this read `probe.duration`,
      # which `renderQc.probe` does not return, so the pass refused every
      # reference with a plausible message and never sampled a frame.
      - name: Guard — the caption vision pass sends real frames and checks the answer
        run: |
          node -e "require('child_process').execFileSync('ffmpeg',['-version'],{stdio:'ignore'})" \
            || { echo 'ffmpeg missing: the sampled frames would not be real'; exit 1; }
          node tests/reference-vision.test.js
      - name: Guard — an MP4 export cannot run away with its own size
        run: node tests/recording-export.test.js
      # The one step that drives ffmpeg the way the box does: a real remux with
      # the service's own arguments, a libass burn with the platform fonts, the
      # filter inventory the scene and reel graphs need, and an mp3 extract.
      # It is also the script someone runs on the box before switching to a new
      # build, so running it here keeps it honest.
      - name: Guard — ffmpeg does everything the pipeline needs
        run: node scripts/ffmpeg-check.js
      # "8 of 8 playback copies" counts play_key, which says a remux happened,
      # not that it produced a usable index. cues-audit.js is the check that
      # opens the files; this guards its judgement and that the offsets it
      # reads mean what they say. It builds real WebMs, so it needs the ffmpeg
      # installed above, and it fails rather than skips without one.
      - name: Guard — a playback copy indexed at the tail is not called ready
        run: node tests/cues-audit.test.js
      - name: Guard — the reel checks do not fail the plan's own example hook
        run: node tests/reel-checks.test.js
      - name: Guard — a tightened edit keeps no sliver too short to watch
        run: node tests/silence-cut.test.js
      # Word timings alone cannot tell dead air from a cough, a door or room
      # tone, and cutting one of those removes a sound the viewer heard.
      - name: Guard — a gap is only cut when the audio agrees it is empty
        run: node tests/silence-cut-audio.test.js
      - name: Guard — the reel checks are never scored on a mixture of rule sets
        run: node tests/reel-outcomes.test.js
      - name: Guard — every scene template renders as long as it promised
        run: |
          node -e "require('child_process').execFileSync('ffmpeg',['-version'],{stdio:'ignore'})" \
            || { echo 'ffmpeg missing: the render assertions would silently skip'; exit 1; }
          node tests/scenes.test.js
      - name: Guard — the worked example says what it could not demonstrate
        run: |
          node -e "require('child_process').execFileSync('ffmpeg',['-version'],{stdio:'ignore'})" \
            || { echo 'ffmpeg missing: the example assertions would silently skip'; exit 1; }
          node tests/example-reel.test.js
      - name: Guard — b-roll lands in its span and the speaker comes back after
        run: |
          node -e "require('child_process').execFileSync('ffmpeg',['-version'],{stdio:'ignore'})" \
            || { echo 'ffmpeg missing: the overlay assertions would silently skip'; exit 1; }
          node tests/broll.test.js
      - name: Guard — every caption template burns, and burns differently
        run: |
          node -e "require('child_process').execFileSync('ffmpeg',['-version'],{stdio:'ignore'})" \
            || { echo 'ffmpeg missing: the burn assertions would silently skip'; exit 1; }
          node tests/captions.test.js
      - name: Guard — clicking a past brief goes somewhere
        run: node tests/paid-past-briefs.test.js
      - name: Guard — the authority fill lands before the monthly reports
        run: node tests/month-end.test.js
      - name: Guard — a trending sound links to a page that opens
        run: node tests/tiktok-sound.test.js
      - name: Guard — a mailbox OMI reads can be opened without a password
        run: node tests/mailbox-oauth.test.js
      - name: Guard — Earned's Results emphasises one tile, and not in black
        run: node tests/earned-results-tiles.test.js
      - name: Guard — a 500-row delete has to be typed, and deletes only those
        run: node tests/publications-panel.test.js
      - name: Guard — SOSTAC guidance exists untailored and names real screens
        run: node tests/sostac-how.test.js
      - name: Guard — the small fixes off the 31 October review
        run: node tests/review-batch-small.test.js
      - name: Guard — the contact library sorts on the server, and its red button asks for the count
        run: node tests/contacts-sort.test.js
      - name: Guard — Google GoTo URLs are resolved before anything reads them
        run: node tests/goto-urls.test.js
      - name: Guard — a deploy under an open tab reloads instead of erroring
        run: node tests/lazy-chunk.test.js
      - name: Guard — Create's options, the Releases back link, the hook vault split
        run: node tests/layout-three.test.js
      - name: Guard — the cache report tells a saving from a premium nobody collects
        run: node tests/cache-report.test.js
      - name: Guard — the login screen does not reload itself
        run: node tests/login-flicker.test.js
      - name: Guard — the writing standard sits in the header, beside Share
        run: node tests/writing-standard.test.js
      - name: Guard — an empty tender list says which of the four reasons it is
        run: node tests/tenders-empty.test.js
      - name: Guard — every failure count says what it counts
        run: node tests/campaign-failures.test.js
      - name: Guard — nothing calls window.prompt, which can silently do nothing
        run: node tests/no-window-prompt.test.js
      - name: Guard — a dead domain is named once; a broken resolver is not believed
        run: node tests/domain-exists.test.js
      - name: Guard — the browser drives still run outside the container that wrote them
        run: node tests/drives-portable.test.js
      - name: Guard — the browser harness wraps the page in the app's own providers
        run: node tests/harness-providers.test.js
      - name: Guard — PR 2 of the review plan, the nav session, holds
        run: node tests/pr2-nav-session.test.js
      - name: Guard — PR 3 of the review plan, one place for every database job
        run: node tests/pr3-database-tools.test.js
      - name: Guard — the media-desk assistant is a panel, not a row
        run: node tests/assistant-panel.test.js
      - name: Guard — an `embedded` branch nothing can reach is not kept
        run: node tests/embedded-reachable.test.js
      - name: Guard — a publication can be added by hand, and only once
        run: node tests/outlet-create.test.js
      - name: Guard — footage can be dropped in, several at a time
        run: node tests/library-upload.test.js
      - name: Guard — a finished design is filed, and knows its set
        run: node tests/design-render-filed.test.js
      - name: Guard — what the client is shown, on Paid and Shared
        run: node tests/client-visibility.test.js
      - name: Guard — the social SQL only names columns that exist
        run: node tests/social-sql-columns.test.js
      - name: Guard — snap engine finds edges within threshold and excludes the dragged item
        run: node tests/snap.test.js
      - name: Guard — the render route starts ffmpeg, tracks progress and serves the file
        run: node tests/composition-render-route.test.js
      - name: Guard — the render service resolves assets and parses ffmpeg progress
        run: node tests/composition-render-service.test.js
      # The composition editor is the sole video editor for every user, and
      # until now only the two guards above ran on a runner. The fifteen
      # below — the model, the source-to-timeline mapping, the render graph,
      # the browser playback model, the editing helpers, the agreement tests
      # that are the whole preview-matches-render guarantee, and four
      # mutation harnesses — existed from PRs #1952 to #1959 and were never
      # executed by CI. 338 of the suite's 385 assertions had never run.
      # That is the pangram.test.js lesson at fifteen times the scale:
      # adding a test file is half the job, and this is the other half.
      - name: Guard — the composition model
        run: node tests/composition.test.js
      - name: Guard — animatable transforms, and a split that divides them
        run: node tests/composition-transforms.test.js
      - name: Guard — source-to-timeline word mapping
        run: node tests/composition-mapping.test.js
      - name: Guard — the single-pass render graph
        run: node tests/composition-render.test.js
      - name: Guard — the browser playback model
        run: node tests/composition-playback.test.js
      - name: Guard — timeline editing helpers and ripple
        run: node tests/composition-editing.test.js
      - name: Guard — the timeline surface
        run: node tests/composition-timeline.test.js
      - name: Guard — preview and render agree on fixtures
        run: node tests/compositor-agreement.test.js
      - name: Guard — templates, variation and binding
        run: node tests/composition-template.test.js
      - name: Guard — the batch pre-flight
        run: node tests/composition-batch.test.js
      # The render queue was two module-level variables holding closures, so a
      # deploy mid-batch abandoned the rest of it while the rows went on
      # reading 'queued' with nothing that could run them. Its behaviour under
      # real concurrency is proved in composition-render-queue.db.test.js,
      # which needs a Postgres; this pins the single words of SQL that make it
      # correct, because a word is easy to delete.
      - name: Guard — the render queue's SQL decisions
        run: node tests/composition-render-queue.test.js
      # A batch runs unattended, so its bookkeeping decisions are the ones an
      # operator acts on without checking: which word describes an item, which
      # number means "needs looking at", and that a verdict cannot be put on
      # something that never rendered. The real thirty-item run is proved in
      # composition-batches.db.test.js, which needs a Postgres.
      - name: Guard — a batch's bookkeeping
        run: node tests/composition-batches.test.js
      # Thirty unattended renders are only useful if the sheet can say which
      # two to watch first. These pin the verdict's decisions and the parsers
      # that feed it — including two faults found by running the gate on real
      # renders: a flat picture cannot show movement, and ebur128's first `I:`
      # is the first frame's running figure rather than the file's.
      - name: Guard — the QC verdict, and what it tells the operator
        run: node tests/render-qc.test.js
      # Proposing a template from somebody else's video. Nearly every
      # assertion is about what it REFUSES to claim: no rhythm from one shot,
      # no movement read off a flat picture, no caption treatment guessed, and
      # nothing proposed outside our own motion vocabulary. A confident wrong
      # proposal is the failure mode, because somebody runs thirty videos
      # through it.
      - name: Guard — a reference proposal says what it could not read
        run: node tests/reference-analysis.test.js
      # The `fx` source kind was declared, validated and accepted by the
      # composition model with no branch in the renderer, so an effect became
      # an ordinary ffmpeg input and the route answered "has no file on disk"
      # — the same fault captions had. These pin the catalogue and the
      # generated input.
      - name: Guard — an effect generates itself rather than needing a file
        run: node tests/composition-fx.test.js
      # Matching somebody else's caption treatment to one of our 31 presets.
      # The round trip is the guarantee: every preset asked what it would look
      # like, fed back, and the right answer in the shortlist 31 times out of
      # 31. The six it does not pick outright are named, because they are
      # genuinely identical in a still frame.
      - name: Guard — a caption treatment is matched, never generated
        run: node tests/caption-match.test.js
      # An effect is described three times: a geq expression for ffmpeg, the
      # arithmetic as a function, and a canvas paint for the preview. This
      # evaluates the shipped expression numerically and holds all three
      # against each other, because a preview that disagrees with the export
      # is the page lying about its own output.
      - name: Guard — the preview's mask and the render's agree
        run: node tests/composition-fx-agreement.test.js
      # The agent skill is prose, which is the one thing here nothing
      # compiles. This runs its four worked examples through the real model
      # and the real graph, checks every identifier and path it names, and
      # asserts that every field the validator reads is documented — so
      # adding a field to the model fails CI until the skill says what it
      # does. It also regenerates the published JSON Schema and fails if the
      # committed file has drifted from the model it is built from.
      - name: Guard — the composition skill and its schema are still true
        run: node tests/composition-skill.test.js
      # A photograph could not be added to a composition by hand until
      # 9 November: the model, the render graph, the preview and the batch had
      # all handled a still for weeks, and one mime filter plus one `accept`
      # attribute refused them. Both are lines no model test can see, so this
      # holds the four descriptions of a photograph against each other — what
      # the server stores, what the picker offers, what the graph does with
      # it, and what a camera move means.
      - name: Guard — a photograph can enter the editor
        run: node tests/composition-still.test.js
      # A brief is what was agreed before a build started, and docs/omi/briefs/
      # exists because one that lived only as a chat link was lost: the Produce
      # studio layout was agreed, mocked, and then production shipped six
      # separate nav rows against it for four sessions. Nothing loads briefs/
      # on its own, so the pointer chain from CLAUDE.md through agent-guide.md
      # is the only thing that makes it reachable, and an index that has
      # drifted from the folder is worse than none.
      - name: Guard — a brief cannot go missing quietly
        run: node tests/briefs-contract.test.js
      # Composition renders land beside a client's own uploads, so the sweep
      # that deletes them is one filename pattern away from deleting
      # somebody's footage. These pin the pattern and the rule: a batch item
      # nobody has reviewed is held however old it is, because sweeping it
      # leaves the review sheet offering a row whose file is gone.
      - name: Guard — the disk sweep takes only our own renders
        run: node tests/composition-retention.test.js
      # "Send to Edit" was never only a missing route: a recording lives
      # behind `mediaStore` under a `storage_key` and the render path resolved
      # only uploads-tree urls, so a composition pointing at one could be
      # built and would refuse to render with "has no file on disk" about a
      # file that was fine. These pin the resolver, the recipe (checked
      # against `validate()` rather than written inside a route handler) and
      # the lifetime of a streamed-down copy.
      - name: Guard — a recording can be edited, and its temp copy is let go
        run: node tests/recording-to-composition.test.js
      # The quietest deploy fault there is: every check green, the commit on
      # the box, and the fix in it not shipped. `update.sh` had no step for
      # `dev/platform/worker/`, so the encode worker went on running the old
      # code after every merge. An ecosystem config is a declaration that
      # something runs forever, so the deploy has to know about it — add a
      # third and this fails until it does.
      - name: Guard — the deploy reaches every process that runs forever
        run: node tests/deploy-reaches-workers.test.js
      # The spoken shape of a reference: hook, problem, solution, call to
      # action. The labelling is a model's, and it is CHECKED against the
      # transcript — a span covering no words, a solution before its problem,
      # or no CTA where "link in bio" is plainly said all come back as
      # disagreements rather than as a reading.
      - name: Guard — a labelled shape is checked against what was said
        run: node tests/structure-label.test.js
      # And the pass around it, every boundary replaced and what crossed it
      # asserted. The ordering is the one that costs money: the words are in
      # hand and the Whisper charge is on the record before anything else can
      # throw.
      - name: Guard — the structure pass logs what it spent, in the right order
        run: node tests/reference-structure.test.js
      - name: Guard — composition CRUD and persistence
        run: node tests/compositions.test.js
      - name: Guard — the compose routes
        run: node tests/compose.test.js
      - name: Guard — design pages as graphics in time
        run: node tests/compose-design.test.js
      - name: Mutations — model and mapping
        run: node tests/composition-mutations.test.js
      - name: Mutations — the render graph
        run: node tests/composition-render-mutations.test.js
      - name: Mutations — the playback model
        run: node tests/composition-playback-mutations.test.js
      - name: Mutations — timeline editing
        run: node tests/composition-timeline-mutations.test.js
      # Judged on pixels and on the agreement test, not only on the graph
      # string: three faults in this build were invisible to anything that
      # reads a graph, so a sweep that ran only the string tests would be
      # certifying the wrong thing. Needs the ffmpeg installed above.
      - name: Mutations — the effects and the fx render branch
        run: node tests/composition-fx-mutations.test.js
      # Most of the matcher's value is in what it declines to claim, so most
      # of these mutations make it claim something: that it can tell 105pt
      # type from 102pt, that a scale preset's highlight colour is on the
      # screen, that an all-caps reference can be matched on a case no preset
      # carries.
      - name: Mutations — the caption matcher
        run: node tests/caption-match-mutations.test.js
      # Most of these remove a check, because holding a model's answer up
      # against the transcript is the whole job: a suite that only tested a
      # good labelling would pass on a version that accepted anything.
      - name: Mutations — the structure labeller
        run: node tests/structure-label-mutations.test.js
      # Spend that is recorded wrong is spend nothing can cap. The fault this
      # guards called OpenAI, threw on the next line, discarded the transcript
      # it had just paid for, and recorded no cost — so every click of
      # Transcribe charged again. It reads every recordApiCost call in the
      # backend, because the fault is in the wiring and no unit test of either
      # side can see it.
      - name: Guard — every cost call records something a budget can see
        run: node tests/cost-log-callers.test.js
      - name: Syntax check every service and route
        run: |
          set -e
          find src -name '*.js' -print0 | xargs -0 -n1 node --check
