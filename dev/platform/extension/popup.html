<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      width: 320px;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      font-size: 13px;
      color: #1e293b;
      padding: 16px;
    }
    h1 {
      font-size: 15px;
      font-weight: 600;
      margin-bottom: 12px;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    h1 .dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: #94a3b8;
    }
    h1 .dot.connected { background: #16a34a; }
    h1 .dot.error { background: #dc2626; }
    .section {
      margin-bottom: 14px;
    }
    label {
      display: block;
      font-size: 11px;
      font-weight: 600;
      color: #64748b;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      margin-bottom: 4px;
    }
    input[type="text"], input[type="url"] {
      width: 100%;
      padding: 6px 8px;
      font-size: 13px;
      border: 1px solid #cbd5e1;
      border-radius: 4px;
      background: #fff;
    }
    input:focus {
      outline: none;
      border-color: #2563eb;
      box-shadow: 0 0 0 1px #2563eb;
    }
    .btn {
      padding: 6px 14px;
      font-size: 13px;
      font-weight: 500;
      border: none;
      border-radius: 4px;
      cursor: pointer;
    }
    .btn-primary {
      background: #2563eb;
      color: #fff;
    }
    .btn-primary:hover { background: #1d4ed8; }
    .btn-danger {
      background: #fff;
      color: #dc2626;
      border: 1px solid #fecaca;
      font-size: 12px;
      padding: 4px 10px;
    }
    .btn-danger:hover { background: #fef2f2; }
    .status {
      font-size: 12px;
      padding: 8px;
      border-radius: 4px;
      margin-top: 8px;
    }
    .status-ok {
      background: #f0fdf4;
      color: #166534;
      border: 1px solid #bbf7d0;
    }
    .status-err {
      background: #fef2f2;
      color: #991b1b;
      border: 1px solid #fecaca;
    }
    .actions {
      display: flex;
      gap: 8px;
      margin-top: 8px;
    }
    .info {
      font-size: 11px;
      color: #94a3b8;
      margin-top: 10px;
      line-height: 1.5;
    }
  </style>
</head>
<body>
  <h1><span class="dot" id="statusDot"></span> OMI Xero Brain</h1>

  <div id="setupView">
    <div class="section">
      <label>OMI Server URL</label>
      <input type="url" id="serverUrl" placeholder="https://your-omi.example.com">
    </div>
    <div class="section">
      <label>Extension Token</label>
      <input type="text" id="token" placeholder="Paste token from OMI Settings">
    </div>
    <div class="actions">
      <button class="btn btn-primary" id="saveBtn">Save &amp; Test</button>
    </div>
    <div id="statusMsg"></div>
  </div>

  <div id="connectedView" style="display: none;">
    <div class="status status-ok" id="connectedStatus">
      Connected to OMI. The brain will advise on the Xero reconciliation page.
    </div>
    <div class="actions" style="margin-top: 12px;">
      <button class="btn btn-danger" id="disconnectBtn">Disconnect</button>
    </div>
  </div>

  <p class="info">
    Generate a token in OMI under Settings &gt; Accounts &gt; Extension Tokens.
    The extension reads payee names from the Xero reconciliation page and shows
    coding suggestions. It never writes to Xero.
  </p>

  <script src="popup.js"></script>
</body>
</html>
