name: Architourian WordPress Integration — Release

on:
  push:
    branches: [ main ]
    paths:
      - 'dev/architourian-wordpress/**'
      - '.github/workflows/architourian-wordpress-release.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Read plugin version
        id: ver
        working-directory: dev/architourian-wordpress
        run: |
          V="$(grep -m1 -E '^\s*\*\s*Version:' architourian-wordpress.php | sed -E 's/.*Version:\s*//' | tr -d '[:space:]')"
          if [ -z "$V" ]; then echo "::error::Could not read version from plugin header"; exit 1; fi
          C="$(grep -m1 -E "define\(\s*'ATWP_VERSION'" architourian-wordpress.php | sed -E "s/.*'ATWP_VERSION'\s*,\s*'([^']+)'.*/\1/")"
          if [ "$V" != "$C" ]; then echo "::error::Version mismatch — header is $V but ATWP_VERSION is $C. Bump both."; exit 1; fi
          echo "version=$V" >> "$GITHUB_OUTPUT"
          echo "tag=atwp-v$V" >> "$GITHUB_OUTPUT"

      - name: Skip if this release already exists
        id: exists
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "${{ steps.ver.outputs.tag }}" -R "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
            echo "Release ${{ steps.ver.outputs.tag }} already exists — nothing to do."
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Build plugin zip
        if: steps.exists.outputs.exists == 'false'
        working-directory: dev/architourian-wordpress
        run: |
          chmod +x bin/build-zip.sh
          bin/build-zip.sh "$GITHUB_WORKSPACE/dist"

      - name: Create tag + release with the zip asset
        if: steps.exists.outputs.exists == 'false'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ steps.ver.outputs.tag }}" \
            "$GITHUB_WORKSPACE/dist/architourian-wordpress-${{ steps.ver.outputs.version }}.zip" \
            -R "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "Architourian WordPress Integration ${{ steps.ver.outputs.version }}" \
            --generate-notes
