name: Auto-merge Claude PRs

# Merges PRs opened from Claude's working branches (claude/*) automatically once
# they are mergeable and every check on the head commit is green. Scoped to
# claude/* only, so PRs you or a teammate open are never touched.
#
# "Green" means: every required check has REPORTED, and everything that
# reported passed. Both halves are load-bearing. Without the first, jq's `all`
# over an empty array is true and a PR merges before any check starts; that
# happened to #1693, #1695 and #1696. The bot's own check run is excluded from
# the rollup because it is posted against the PR head commit and is
# in_progress while this job runs, which blocked #1697 and #1698 when they were
# fully green.
#
# IMPORTANT — the post-merge deploy:
# GitHub does NOT run further workflows for pushes made with the default
# GITHUB_TOKEN (loop protection). platform-deploy.yml runs `on: push` to main,
# so a merge made here with GITHUB_TOKEN lands on main and the deploy never
# fires. That is not theoretical: this workflow's first run was 2 Sept 2026,
# and platform push-deploys fell from 63 in August to 1 in October, because
# from that day the bot was doing the merging. Every run since has printed a
# warning saying so, into a log nobody opens, which is the same as not warning.
#
# So the workflow now finishes the job itself: after merging a PR that touches
# anything platform-deploy.yml watches, it dispatches that workflow directly.
# workflow_dispatch is explicitly exempt from the loop protection — GitHub's
# docs state that workflow_dispatch and repository_dispatch events always
# create workflow runs — so GITHUB_TOKEN plus `actions: write` is enough and
# no PAT is required.
#
# A repo secret AUTO_MERGE_TOKEN (fine-grained PAT, Contents and Pull requests
# Read/Write) is still honoured and still the tidier arrangement: the merge is
# then attributed to a user and the push fires the deploy like a human merge.
# When it is set, the dispatch below is skipped, so the deploy runs once either
# way rather than twice.

on:
  pull_request:
    types: [opened, reopened, synchronize, ready_for_review]
  check_suite:
    types: [completed]
  # The one that actually matters.
  #
  # GitHub does NOT trigger workflows from check_suite or check_run events
  # that GitHub Actions itself produced — the same loop protection that stops
  # a GITHUB_TOKEN push firing `on: push`. So platform-checks going green
  # never woke this workflow. The only check_suite events that reached it came
  # from third-party apps (Cloudflare Pages), which finish BEFORE the platform
  # checks do, so the bot evaluated every PR too early, declined correctly,
  # and was never asked again until the */30 safety net came round.
  #
  # workflow_run does fire for Actions workflows, so this is the trigger that
  # lets the gate see CI finish.
  workflow_run:
    workflows: ["Platform checks", "Auto-merge gate"]
    types: [completed]
  schedule:
    - cron: '*/30 * * * *'   # safety net for any missed events
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write
  # Lets this workflow dispatch platform-deploy.yml after a merge it made with
  # GITHUB_TOKEN, which `on: push` will not see.
  actions: write

concurrency:
  group: auto-merge-claude
  cancel-in-progress: false

jobs:
  automerge:
    runs-on: ubuntu-latest
    steps:
      - name: Merge green claude/* PRs
        env:
          GH_TOKEN: ${{ secrets.AUTO_MERGE_TOKEN || github.token }}
          HAS_PAT: ${{ secrets.AUTO_MERGE_TOKEN != '' }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          # Tracks whether anything merged this round needs the platform
          # redeployed. Set only after a merge actually succeeds, so a failed
          # merge never dispatches a deploy of code that is not on main.
          deploy_needed=false

          # Open PRs from claude/* branches that are not drafts.
          prs=$(gh pr list --repo "$REPO" --state open --json number,headRefName,isDraft \
            --jq '.[] | select(.isDraft==false) | select(.headRefName|startswith("claude/")) | .number')
          if [ -z "$prs" ]; then echo "No open Claude PRs."; exit 0; fi

          for pr in $prs; do
            # Which checks MUST have reported before this PR can merge.
            #
            # "Every check that has reported is green" is not a gate: jq's
            # `all` over an empty array is true, so a PR whose checks have not
            # registered yet reads as fully green. Cloudflare Pages also
            # registers seconds before platform-checks does, so "at least one
            # check" is not enough either. platform-checks runs on changes
            # under dev/platform/**, so when the PR touches those paths its two
            # jobs are required by name.
            # Fail safe: if the file list cannot be read, do not merge this
            # round rather than quietly treating the PR as needing no checks.
            # Inside an `if`, a non-zero exit does not trip `set -e`, so this
            # has to be handled explicitly.
            if ! files=$(gh pr diff "$pr" --repo "$REPO" --name-only); then
              echo "::warning::could not list changed files for #$pr — not merging this round."
              continue
            fi
            required=""
            if printf '%s\n' "$files" | grep -q '^dev/platform/'; then
              required="backend frontend"
            fi

            # Does merging this PR need a deploy? Mirrors the paths in
            # platform-deploy.yml's `on: push` filter; the gate test reads both
            # files and fails if they drift apart.
            touches_platform=false
            if printf '%s\n' "$files" | grep -qE '^(dev/platform/|dev/october-mi-shopify/|\.github/workflows/platform-deploy\.yml$)'; then
              touches_platform=true
            fi

            # Ready = GitHub says it is mergeable, every required check has
            # reported, and every check that has reported concluded
            # success/neutral/skipped. A pending or in-progress check has no
            # conclusion, falls back to PENDING, and blocks.
            #
            # The bot's own check run is excluded. It is posted against the PR
            # head commit, so it appears in the rollup it is evaluating, and
            # while this job runs it is in_progress — which means the gate
            # could only ever pass when nothing at all had registered, itself
            # included. That is the whole bug, in both directions: it merged
            # PRs before CI started and declined PRs that were fully green.
            # Piped into the real jq rather than `gh --jq`: gh embeds jq but
            # exposes no way to pass positional arguments, so `--args` is an
            # unknown flag there. The repo's gate test runs this same filter
            # through the same binary, which is the only way the test can
            # stand for what actually executes.
            if ! pr_json=$(gh pr view "$pr" --repo "$REPO" --json mergeable,statusCheckRollup); then
              echo "::warning::could not read #$pr — not merging this round."
              continue
            fi
            ready=$(printf '%s' "$pr_json" | jq -r '
              ((.statusCheckRollup // []) | map(select((.name // .context // "") != "automerge"))) as $checks
              | ($checks | map(.name // .context // "")) as $names
              | (.mergeable == "MERGEABLE")
                and ($checks | length > 0)
                and (($ARGS.positional // []) - $names | length == 0)
                and ($checks | all(. as $c | ["SUCCESS","NEUTRAL","SKIPPED"]
                                             | index($c.conclusion // $c.state // "PENDING") != null))
            ' --args $required)

            if [ "$ready" = "true" ]; then
              echo "PR #$pr is green + mergeable — merging."
              if gh pr merge "$pr" --repo "$REPO" --merge; then
                if [ "$touches_platform" = "true" ]; then deploy_needed=true; fi
              else
                echo "::warning::merge of #$pr failed; will retry on the next event."
              fi
            else
              echo "PR #$pr not ready yet (conflict, or checks pending/missing) — skipping."
            fi
          done

          # Finish the job. A GITHUB_TOKEN merge cannot wake `on: push`, but
          # workflow_dispatch is exempt from that loop protection, so ask the
          # deploy to run. Once per round rather than once per PR: three PRs
          # merged together deploy once.
          #
          # Skipped when AUTO_MERGE_TOKEN is set, because then the merge push
          # fires the deploy by itself and dispatching would queue a second,
          # redundant run behind it.
          if [ "$deploy_needed" != "true" ]; then
            echo "Nothing merged that platform-deploy watches — no deploy needed."
          elif [ "$HAS_PAT" = "true" ]; then
            echo "Merged under AUTO_MERGE_TOKEN — the push fires the deploy; not dispatching."
          elif gh workflow run platform-deploy.yml --repo "$REPO" --ref main; then
            echo "Dispatched platform-deploy against main."
          else
            echo "::error::Merged a platform change but could not dispatch platform-deploy. Run it by hand from the Actions tab: the merge is on main and is NOT live."
          fi
