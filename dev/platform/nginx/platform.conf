server {
    listen 80;
    server_name platform.octobercomms.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name platform.octobercomms.com;

    ssl_certificate /etc/letsencrypt/live/platform.octobercomms.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/platform.octobercomms.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;

    # Security headers
    add_header X-Frame-Options DENY;
    add_header X-Content-Type-Options nosniff;
    add_header X-XSS-Protection "1; mode=block";
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin";

    # Serve React frontend
    root /var/www/platform;
    index index.html;

    # React SPA routing
    location / {
        try_files $uri $uri/ /index.html;
    }

    # API proxy
    location /api/ {
        proxy_pass http://localhost:3001;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
        proxy_read_timeout 300s;
    }

    # OAuth callbacks proxy
    location /auth/ {
        proxy_pass http://localhost:3001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # PDF downloads proxy
    location /pdfs/ {
        proxy_pass http://localhost:3001;
        proxy_set_header Authorization $http_authorization;
        proxy_set_header Host $host;
    }

    # Coverage attachments (PDFs/scans the AM uploads against a coverage entry).
    # Backend serves these from express.static at /coverage-attachments; without
    # this proxy the request falls into `location /` and try_files returns the
    # SPA index.html, so the browser opens the React app on an unknown route and
    # renders a blank screen instead of the file. Public by design — the
    # unguessable filename is the access control (same pattern as the public
    # coverage portal), so no auth header is forwarded.
    location /coverage-attachments/ {
        proxy_pass http://localhost:3001;
        proxy_set_header Host $host;
    }

    # Gzip
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;
    gzip_min_length 1000;

    client_max_body_size 20M;
}
