name = "social-review"
compatibility_date = "2025-10-01"
pages_build_output_dir = "public"

# R2 holds both the uploaded media and the per-review manifest JSON.
# Create the bucket once:  npx wrangler r2 bucket create social-review-media
[[r2_buckets]]
binding = "MEDIA"
bucket_name = "social-review-media"

# The name shown in the admin header and the browser tab. This tool is
# deliberately unbranded so one deployment can front every client; change
# this line if you want it to say something else.
[vars]
BRAND_NAME = "Content Review"

# Secrets are NOT set here. Set them in the Cloudflare dashboard
# (Workers & Pages > the project > Settings > Variables and Secrets):
#   TEAM_PASSWORD  - the shared password your team types at /admin
#   AUTH_SECRET    - any long random string, used to sign the session cookie
