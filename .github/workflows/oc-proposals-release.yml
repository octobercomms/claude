# Auto-publishes a GitHub Release for October Proposals whenever a new version
# lands on `main`. The release IS the build: the Action reads the version from
# the plugin header, and if no release exists for it yet, builds the zip and
# creates the tag + release itself (no manual tag push needed).
#
# The plugin's built-in self-updater then offers that release to the live site
# as a one-click update — so the plugin is installed once and updated in place.
name: October Proposals — Release

on:
  push:
    branches: [ main ]
    paths:
      - 'dev/oc-proposals/**'
      - '.github/workflows/oc-proposals-release.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Read plugin version
        id: ver
        working-directory: dev/oc-proposals
        run: |
          V="$(grep -m1 -E '^\s*\*\s*Version:' oc-proposals.php | sed -E 's/.*Version:\s*//' | tr -d '[:space:]')"
          if [ -z "$V" ]; then echo "::error::Could not read version from plugin header"; exit 1; fi
          echo "version=$V" >> "$GITHUB_OUTPUT"
          echo "tag=ocp-v$V" >> "$GITHUB_OUTPUT"

      - name: Skip if this release already exists
        id: exists
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "${{ steps.ver.outputs.tag }}" -R "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
            echo "Release ${{ steps.ver.outputs.tag }} already exists — nothing to do."
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up PHP (for composer deps, when present)
        if: steps.exists.outputs.exists == 'false'
        uses: shivammathur/setup-php@v2
        with:
          php-version: '7.4'
          tools: composer

      - name: Build plugin zip
        if: steps.exists.outputs.exists == 'false'
        working-directory: dev/oc-proposals
        run: |
          chmod +x bin/build-zip.sh
          bin/build-zip.sh "$GITHUB_WORKSPACE/dist"

      - name: Create tag + release with the zip asset
        if: steps.exists.outputs.exists == 'false'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ steps.ver.outputs.tag }}" \
            "$GITHUB_WORKSPACE/dist/oc-proposals-${{ steps.ver.outputs.version }}.zip" \
            -R "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "October Proposals ${{ steps.ver.outputs.version }}" \
            --generate-notes
