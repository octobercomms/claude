server {
    listen 80;
    server_name platform.octobercomms.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name platform.octobercomms.com;

    ssl_certificate /etc/letsencrypt/live/platform.octobercomms.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/platform.octobercomms.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;

    # Security headers
    add_header X-Frame-Options DENY;
    add_header X-Content-Type-Options nosniff;
    add_header X-XSS-Protection "1; mode=block";
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin";

    # Serve React frontend
    root /var/www/platform;
    index index.html;

    # React SPA routing
    location / {
        try_files $uri $uri/ /index.html;

        # Content-Security-Policy for the served SPA document (audit finding
        # H2). Scoped to this location on purpose: the /api/ proxy already
        # sets its own Helmet CSP, and a second policy there would intersect
        # with it and could break the Claude-authored report HTML rendered in
        # an iframe. The directives match what the app actually loads:
        #   - script-src 'self'      — the built index.html has no inline
        #                              script, only the external module bundle.
        #   - style-src 'unsafe-inline' — index.html has an inline <style> and
        #                              the UI uses inline style attributes.
        #   - blob: on img/font/media — the brand-kit previews load images,
        #                              fonts (FontFace) and video from blob URLs.
        # The other security headers are repeated here because nginx add_header
        # does not inherit into a location that sets its own add_header.
        add_header X-Frame-Options DENY;
        add_header X-Content-Type-Options nosniff;
        add_header X-XSS-Protection "1; mode=block";
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin";
        add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https:; font-src 'self' data: blob:; media-src 'self' blob: data: https:; connect-src 'self' https:; frame-src 'self' https:; object-src 'none'; base-uri 'self'; form-action 'self'";
    }

    # Video Studio raw-clip uploads — these are large (the backend accepts up
    # to 1GB/clip). The default body cap would reject them at the nginx layer
    # with a 413 long before the request reached Node, and the SPA's api layer
    # surfaced that as a misleading "backend may be offline". Longest-prefix
    # match means /api/video/ wins over /api/ for these requests, so it needs
    # its own full proxy config (locations don't inherit from siblings).
    # request_buffering off streams the upload straight to the backend instead
    # of spooling the whole file to a temp file on nginx first.
    location /api/video/ {
        proxy_pass http://localhost:3001;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
        proxy_read_timeout 600s;
        proxy_request_buffering off;
        client_max_body_size 1024M;
        client_body_timeout 600s;
    }

    # API proxy
    location /api/ {
        proxy_pass http://localhost:3001;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
        proxy_read_timeout 300s;
    }

    # OAuth callbacks proxy
    location /auth/ {
        proxy_pass http://localhost:3001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # PDF downloads proxy
    location /pdfs/ {
        proxy_pass http://localhost:3001;
        proxy_set_header Authorization $http_authorization;
        proxy_set_header Host $host;
    }

    # Coverage attachments (PDFs/scans the AM uploads against a coverage entry).
    # Backend serves these from express.static at /coverage-attachments; without
    # this proxy the request falls into `location /` and try_files returns the
    # SPA index.html, so the browser opens the React app on an unknown route and
    # renders a blank screen instead of the file. Public by design — the
    # unguessable filename is the access control (same pattern as the public
    # coverage portal), so no auth header is forwarded.
    location /coverage-attachments/ {
        proxy_pass http://localhost:3001;
        proxy_set_header Host $host;
    }

    # Gzip
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;
    gzip_min_length 1000;

    # Global cap. Most endpoints are small JSON, but brand-kit uploads (logos,
    # B-roll clips, props) accept files up to 100MB on the backend, so the gate
    # needs headroom above that. Video-clip uploads override this to 1GB above.
    client_max_body_size 128M;
}
