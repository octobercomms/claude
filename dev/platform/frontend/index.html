<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>October Marketing Intelligence</title>
    <!-- Home-screen icons: local, padded, white October mark on brand yellow. -->
    <link rel="icon" type="image/png" href="/icon-32.png" sizes="32x32" />
    <link rel="icon" type="image/png" href="/icon-192.png" sizes="192x192" />
    <link rel="apple-touch-icon" href="/icon-180.png" />
    <link rel="apple-touch-icon-precomposed" href="/icon-180.png" />
    <meta name="msapplication-TileImage" content="/icon-192.png" />
    <meta name="theme-color" content="#E7CD41" />
    <!-- Short label under the home-screen icon (iOS) — "October Marketing
         Intelligence" truncates to "OctoberMarketi…", so use a compact name. -->
    <meta name="apple-mobile-web-app-title" content="October MI" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <style>
      @font-face {
        font-family: 'Brockmann';
        src: url('/fonts/brockmann-regular-webfont.woff2') format('woff2'),
             url('/fonts/brockmann-regular-webfont.woff') format('woff'),
             url('/fonts/brockmann-regular-webfont.ttf') format('truetype');
        font-weight: 400;
        font-style: normal;
        font-display: swap;
      }
      @font-face {
        font-family: 'Brockmann';
        src: url('/fonts/brockmann-regularitalic-webfont.woff2') format('woff2'),
             url('/fonts/brockmann-regularitalic-webfont.woff') format('woff'),
             url('/fonts/brockmann-regularitalic-webfont.ttf') format('truetype');
        font-weight: 400;
        font-style: italic;
        font-display: swap;
      }
      @font-face {
        font-family: 'Brockmann';

             url('/fonts/brockmann-medium-webfont.ttf') format('truetype');
        font-weight: 500;
        font-style: normal;
        font-display: swap;
      }
      @font-face {
        font-family: 'Brockmann';
        src: url('/fonts/brockmann-mediumitalic-webfont.woff2') format('woff2'),
             url('/fonts/brockmann-mediumitalic-webfont.woff') format('woff'),
             url('/fonts/brockmann-mediumitalic-webfont.ttf') format('truetype');
        font-weight: 500;
        font-style: italic;
        font-display: swap;
      }
      @font-face {
        font-family: 'Brockmann';
        src: url('/fonts/brockmann-semibold-webfont.woff2') format('woff2'),

             url('/fonts/brockmann-semibold-webfont.ttf') format('truetype');
        font-weight: 600;
        font-style: normal;
        font-display: swap;
      }
      @font-face {
        font-family: 'Brockmann';
        src: url('/fonts/brockmann-semibolditalic-webfont.woff2') format('woff2'),

             url('/fonts/brockmann-semibolditalic-webfont.ttf') format('truetype');
        font-weight: 600;
        font-style: italic;
        font-display: swap;
      }
      @font-face {
        font-family: 'Brockmann';
        src: url('/fonts/brockmann-bold-webfont.woff2') format('woff2'),
             url('/fonts/brockmann-bold-webfont.woff') format('woff'),
             url('/fonts/brockmann-bold-webfont.ttf') format('truetype');
        font-weight: 700;
        font-style: normal;
        font-display: swap;
      }
      @font-face {
        font-family: 'Brockmann';
        src: url('/fonts/brockmann-bolditalic-webfont.woff2') format('woff2'),
             url('/fonts/brockmann-bolditalic-webfont.woff') format('woff'),
             url('/fonts/brockmann-bolditalic-webfont.ttf') format('truetype');
        font-weight: 700;
        font-style: italic;
        font-display: swap;
      }
      *, *::before, *::after { box-sizing: border-box; }
      body {
        margin: 0;
        font-family: 'Brockmann', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
        background: #f5f5f5;
        color: #1a1a1a;
        -webkit-font-smoothing: antialiased;
        -moz-osx-font-smoothing: grayscale;
      }

  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
