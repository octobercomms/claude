# Auto-deploys the October Events planning platform (a static SPA) to
# Cloudflare Pages on every merge to `main`. No build step — the app is plain
# HTML/JS/CSS, so we just publish the folder.
#
# One-time setup (in Cloudflare):
#   1. Create a Pages project named `october-platform` (Direct Upload / no Git).
#   2. Add repo secrets CLOUDFLARE_API_TOKEN (Pages:Edit) and CLOUDFLARE_ACCOUNT_ID.
#   3. Point the custom domain platform.atlantadesignfestival.net at the project.
#
# Uses the first-party wrangler CLI via npx (no third-party action to allow-list).
name: October Platform — Deploy

on:
  push:
    branches: [ main ]
    paths:
      - 'dev/october-platform/**'
      - '.github/workflows/october-platform-deploy.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Publish to Cloudflare Pages
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "::warning::Cloudflare secrets not set — skipping deploy. Add CLOUDFLARE_API_TOKEN + CLOUDFLARE_ACCOUNT_ID."
            exit 0
          fi
          npx --yes wrangler@3 pages deploy dev/october-platform \
            --project-name=october-platform \
            --branch=main \
            --commit-dirty=true
